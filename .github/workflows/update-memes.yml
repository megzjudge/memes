name: Update memes.csv (daily)

on:
  schedule:
    - cron: "15 11 * * *" # daily at 10:15pm Sydney (AEDT)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify discovery exists (required)
        run: |
          test -f latest_ids.json
          node -e "const j=require('./latest_ids.json'); if(!Array.isArray(j.ids)||j.ids.length<14) process.exit(1); console.log('Discovery OK:', j.ids.slice(0,14).join(','));"

      - name: Update memes.csv from discovery
        run: node update-memes.mjs

      - name: Commit changes if any
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add memes.csv
          git commit -m "Update memes.csv"
          git push
