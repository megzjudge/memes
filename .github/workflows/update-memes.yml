name: Update memes.csv (daily)

on:
  schedule:
    - cron: "15 11 * * *" # daily at 10:15pm Sydney (AEDT)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Update memes.csv
        run: node update-memes.mjs
        env:
          IMGFLIP_LIST_PAGE: https://imgflip.com/m/fun/user-images/mbtininja?page=1

      - name: Commit changes if any
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add memes.csv
          git commit -m "Update memes.csv"
          git push
