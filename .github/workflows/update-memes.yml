name: Find newly posted memes

on:
  schedule:
    - cron: "00 14 * * *"   # 1:00 AM AEDT (2:00 PM UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify discovery file exists
        run: |
          test -f latest_ids.json || { echo "Error: latest_ids.json missing!"; exit 1; }

      - name: Check discovery IDs
        run: |
          node -e "
            const j = require('./latest_ids.json');
            if (!Array.isArray(j.ids)) {
              console.error('Error: ids is not an array');
              process.exit(1);
            }
            const len = j.ids.length;
            console.log('Discovery has ' + len + ' IDs:', j.ids.slice(0, Math.min(20, len)).join(', '));
            if (len === 0) console.warn('Warning: 0 IDs in discovery — no new rows will be added.');
          "

      - name: Update memes.csv from discovery
        run: node update-memes.mjs

      - name: Commit changes if any
        run: |
          if git diff --quiet; then
            echo "No changes to memes.csv."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add memes.csv
          git commit -m "Update memes.csv from latest discovery"
          git push
