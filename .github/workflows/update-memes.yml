name: Find newly posted memes

on:
  schedule:
    - cron: "00 14 * * *"   # 1:00 AM AEDT (2:00 PM UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch meme IDs directly from Imgflip
        run: |
          node -e "
            const fetch = require('node-fetch');
            const url = 'https://imgflip.com/all/user-images/mbtininja?sort=latest';
            fetch(url)
              .then(res => res.text())
              .then(html => {
                const idMatches = [...html.matchAll(/href=\"\/i\/([^"]+)\"/g)];
                const ids = idMatches.map(match => match[1]);
                console.log('Found meme IDs:', ids);
                require('fs').writeFileSync('./latest_ids.json', JSON.stringify({ ids }));
              })
              .catch(err => {
                console.error('Error fetching meme IDs:', err);
                process.exit(1);
              });
          "
        
      - name: Update memes.csv from discovery
        run: node update-memes.mjs

      - name: Commit changes if any
        run: |
          if git diff --quiet; then
            echo "No changes to memes.csv."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add memes.csv
          git commit -m "Update memes.csv from latest discovery"
          git push
