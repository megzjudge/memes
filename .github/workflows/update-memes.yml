name: Update memes.csv (daily)

on:
  schedule:
    - cron: "15 11 * * *" # daily at 10:15pm Sydney (AEDT)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify discovery exists (relaxed for catch-up)
        run: |
          test -f latest_ids.json
          node -e "
            const j = require('./latest_ids.json');
            if (!Array.isArray(j.ids)) {
              console.error('Error: ids is not an array');
              process.exit(1);
            }
            const len = j.ids.length;
            if (len < 1) {
              console.warn('Warning: Only ' + len + ' IDs found in latest_ids.json. Proceeding anyway for manual backfill.');
            } else if (len < 14) {
              console.warn('Note: Only ' + len + ' IDs found (less than usual 14). Still proceeding.');
            }
            console.log('Discovery OK (proceeding):', j.ids.slice(0, Math.min(40, len)).join(','));
          "

      - name: Update memes.csv from discovery
        run: node update-memes.mjs

      - name: Commit changes if any
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add memes.csv
          git commit -m "Update memes.csv (manual backfill + daily)"
          git push
