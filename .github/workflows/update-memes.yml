name: Find newly posted memes

on:
  schedule:
    - cron: "00 14 * * *"   # 1:00 AM AEDT (2:00 PM UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install node-fetch v2
        run: npm install node-fetch@2

      - name: Fetch meme IDs directly from Imgflip
        run: |
          node --no-warnings -e '
            const fs = require("fs");
            const fetch = require("node-fetch");
            fetch("https://imgflip.com/all/user-images/mbtininja?sort=latest")
              .then(res => {
                if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                return res.text();
              })
              .then(html => {
                fs.writeFileSync("debug.html", html); // ← save raw HTML to inspect later
                const matches = html.matchAll(/href=["\']\/i\/([^"\']+)["\']/g);
                const ids = Array.from(matches, m => m[1]).filter(id => id && /^[a-z0-9]{5,10}$/i.test(id));
                console.log("Raw matches count:", matches.length ? "some found" : "none");
                console.log("Extracted IDs:", ids);
                if (ids.length === 0) {
                  console.log("First 500 chars of HTML for debug:", html.slice(0, 500));
                }
                fs.writeFileSync("./latest_ids.json", JSON.stringify({ ids }, null, 2));
              })
              .catch(err => {
                console.error("Fetch/scrape failed:", err.message || err);
                process.exit(1);
              });
          '
          
      - name: Update memes.csv from discovery
        run: node update-memes.mjs

      - name: Commit changes if any
        run: |
          if git diff --quiet; then
            echo "No changes to memes.csv."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add memes.csv
          git commit -m "Update memes.csv from latest discovery"
          git push
