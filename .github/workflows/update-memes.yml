name: Find newly posted memes

on:
  schedule:
    - cron: "00 14 * * *"   # 1:00 AM AEDT (2:00 PM UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set Imgflip credentials
        env:
          IMGFLIP_USER: ${{ secrets.IMGFLIP_USER }}
          IMGFLIP_PASS: ${{ secrets.IMGFLIP_PASS }}
        run: echo "Credentials loaded"

      - name: Update memes.csv from latest Imgflip discovery
        run: node update-memes.mjs
        env:
          IMGFLIP_USER: ${{ secrets.IMGFLIP_USER }}
          IMGFLIP_PASS: ${{ secrets.IMGFLIP_PASS }}

      - name: Commit changes if any
        run: |
          if git diff --quiet; then
            echo "No changes to memes.csv."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add memes.csv
          git commit -m "Update memes.csv from latest discovery"
          git push
