name: Auto-Fill Missing Meme Data in memes.csv

on:
  schedule:
    - cron: "30 11 * * *"  # ~10:30pm AEDT
  workflow_dispatch: {}    # manual trigger

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout the repository
      - uses: actions/checkout@v4

      # 2️⃣ Install Node.js
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 3️⃣ Install dependencies (Including node-fetch and other needed packages)
      - name: Install dependencies
        run: |
          npm install csv-parse csv-stringify node-fetch

      # 4️⃣ Pull latest remote changes first
      - name: Pull latest main
        run: git pull origin main

      # 5️⃣ Run the meme discovery script
      - name: Discover missing meme data
        run: node discover-ids.mjs

      # 6️⃣ Commit memes.csv if any changes were made
      - name: Commit updated memes.csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage the CSV file
          git add memes.csv

          # Only commit if there are staged changes
          if git diff --cached --quiet; then
            echo "No new meme data discovered."
            exit 0
          fi

          git commit -m "Auto-update memes.csv with latest meme data"
          git push
