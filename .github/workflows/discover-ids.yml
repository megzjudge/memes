name: Discover new meme IDs

on:
  schedule:
    - cron: "30 11 * * *"  # ~10:30pm AEDT, slightly after your other actions
  workflow_dispatch: {}   # manual trigger button

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Discover latest IDs from Imgflip
        run: node discover-ids.mjs  # Change this to discover-ids.mjs if it's the correct filename

      - name: Commit latest_ids.json if changed
        run: |
          if git diff --quiet; then
            echo "No new IDs discovered."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_ids.json
          git commit -m "Auto-discover new meme IDs"
          git push
