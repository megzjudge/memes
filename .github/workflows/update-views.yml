name: Update meme_daily_updates.csv

on:
  schedule:
    - cron: "43 0 * * *" # daily at 14:47 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update meme_daily_updates.csv
        run: node update-views.mjs

      - name: Commit changes if any
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meme_daily_updates.csv
          git commit -m "Update meme_daily_updates.csv"
          git push
