name = "memes"
main = "worker.js"
compatibility_date = "2026-03-21"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "."
binding = "ASSETS"

[browser]
binding = "MEMES"

# 17 separate cron triggers — each processes one batch of 30 memes
# Staggered every 3 minutes from :00 to :48 past the hour
[[triggers]]
crons = ["0 * * * *"]   # Batch 0 — memes 0–29

[[triggers]]
crons = ["3 * * * *"]   # Batch 1 — 30–59

[[triggers]]
crons = ["6 * * * *"]   # Batch 2 — 60–89

[[triggers]]
crons = ["9 * * * *"]   # Batch 3 — 90–119

[[triggers]]
crons = ["12 * * * *"]  # Batch 4 — 120–149

[[triggers]]
crons = ["15 * * * *"]  # Batch 5 — 150–179

[[triggers]]
crons = ["18 * * * *"]  # Batch 6 — 180–209

[[triggers]]
crons = ["21 * * * *"]  # Batch 7 — 210–239

[[triggers]]
crons = ["24 * * * *"]  # Batch 8 — 240–269

[[triggers]]
crons = ["27 * * * *"]  # Batch 9 — 270–299

[[triggers]]
crons = ["30 * * * *"]  # Batch 10 — 300–329

[[triggers]]
crons = ["33 * * * *"]  # Batch 11 — 330–359

[[triggers]]
crons = ["36 * * * *"]  # Batch 12 — 360–389

[[triggers]]
crons = ["39 * * * *"]  # Batch 13 — 390–419

[[triggers]]
crons = ["42 * * * *"]  # Batch 14 — 420–449

[[triggers]]
crons = ["45 * * * *"]  # Batch 15 — 450–479

[[triggers]]
crons = ["48 * * * *"]  # Batch 16 — 480–509

[observability]
enabled = false

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
