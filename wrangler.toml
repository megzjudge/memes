name = "memes"
main = "worker.js"
compatibility_date = "2026-03-21"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "."
binding = "ASSETS"

[browser]
binding = "MEMES"

[triggers]
crons = ["*/10 * * * *"]

# Paid Workers allow up to 10,000+ subrequests per invocation
[limits]
subrequests = 10000

[observability]
enabled = false

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
