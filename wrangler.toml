name = "memes"
main = "worker.js"
compatibility_date = "2026-03-21"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "."
binding = "ASSETS"

[browser]
binding = "MEMES"

# 10 separate crons — each processes one batch (40 memes)
[[triggers]]
crons = ["0 * * * *"]   # batch 0 at :00

[[triggers]]
crons = ["3 * * * *"]   # batch 1 at :03

[[triggers]]
crons = ["6 * * * *"]   # batch 2 at :06

[[triggers]]
crons = ["9 * * * *"]   # batch 3 at :09

[[triggers]]
crons = ["12 * * * *"]  # batch 4 at :12

[[triggers]]
crons = ["15 * * * *"]  # batch 5 at :15

[[triggers]]
crons = ["18 * * * *"]  # batch 6 at :18

[[triggers]]
crons = ["21 * * * *"]  # batch 7 at :21

[[triggers]]
crons = ["24 * * * *"]  # batch 8 at :24

[[triggers]]
crons = ["27 * * * *"]  # batch 9 at :27

[observability]
enabled = false

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
