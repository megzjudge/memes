name = "memes"
main = "worker.js"
compatibility_date = "2026-03-20"

[assets]
directory = "."
binding = "ASSETS"

[triggers]
crons = [
  "*/5 * * * *"
]

browser = { binding = "MEMES" }

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
