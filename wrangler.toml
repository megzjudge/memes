name = "memes"
main = "worker.js"
compatibility_date = "2026-03-21"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "."
binding = "ASSETS"

[browser]
binding = "MEMES"

# All 17 batch schedules in one clean triggers block
[triggers]
crons = [
  "0 * * * *",   # Batch 0 — memes 0–29 at :00
  "3 * * * *",   # Batch 1 — 30–59 at :03
  "6 * * * *",   # Batch 2 — 60–89 at :06
  "9 * * * *",   # Batch 3 — 90–119 at :09
  "12 * * * *",  # Batch 4 — 120–149 at :12
  "15 * * * *",  # Batch 5 — 150–179 at :15
  "18 * * * *",  # Batch 6 — 180–209 at :18
  "21 * * * *",  # Batch 7 — 210–239 at :21
  "24 * * * *",  # Batch 8 — 240–269 at :24
  "27 * * * *",  # Batch 9 — 270–299 at :27
  "30 * * * *",  # Batch 10 — 300–329 at :30
  "33 * * * *",  # Batch 11 — 330–359 at :33
  "36 * * * *",  # Batch 12 — 360–389 at :36
  "39 * * * *",  # Batch 13 — 390–419 at :39
  "42 * * * *",  # Batch 14 — 420–449 at :42
  "45 * * * *",  # Batch 15 — 450–479 at :45
  "48 * * * *",  # Batch 16 — 480–509 at :48
]

[observability]
enabled = false

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
